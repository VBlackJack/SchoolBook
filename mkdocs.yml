site_name: SchoolBook
site_description: Le compagnon numerique de l'eleve - Maths, Francais, Histoire-Geo & Sciences
site_author: SchoolBook Team
site_url: https://vblackjack.github.io/SchoolBook/
repo_name: VBlackJack/SchoolBook
repo_url: https://github.com/VBlackJack/SchoolBook
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Passer en mode clair
  font:
    text: Nunito
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    logo: material/school

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: fr
  - tags
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

